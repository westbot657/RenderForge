[workspace]
members = [
    "test_app"
]

[package]
name = "renderforge"
version = "0.1.2"
edition = "2024"
description = "A Rendering framework built on top of glow"
license = "GPL-3.0-only"
repository = "https://github.com/westbot657/RenderForge"
readme = "README.md"
keywords = ["rendering", "opengl"]
categories = ["rendering"]
exclude = ["/test_app"]

[dependencies]
glow = "0.16.0"
glam = { version = "0.32.0" }
bytemuck = "1.25.0"
thiserror = { version = "2.0.16" }


